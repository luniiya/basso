<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 32" shape-rendering="crispEdges">
  <title>Basso — pixel night logo</title>
  <!-- midnight cartridge frame -->
  <rect width="64" height="32" fill="#070a1b"/>
  <rect x="2" y="2" width="60" height="28" fill="#111a3c"/>
  <rect x="4" y="4" width="56" height="24" fill="#0a1030"/>
  <rect x="4" y="4" width="56" height="1" fill="#334b84"/>
  <rect x="4" y="27" width="56" height="1" fill="#192b5a"/>

  <!-- tiny quiet sky -->
  <rect x="11" y="8" width="1" height="1" fill="#86a9e8"/>
  <rect x="18" y="6" width="1" height="1" fill="#86a9e8"/>
  <rect x="45" y="7" width="1" height="1" fill="#86a9e8"/>
  <rect x="52" y="10" width="1" height="1" fill="#86a9e8"/>
  <rect x="37" y="10" width="1" height="1" fill="#6e8dcc"/>
  <!-- crescent -->
  <rect x="51" y="5" width="3" height="1" fill="#ffe69a"/>
  <rect x="50" y="6" width="2" height="3" fill="#ffe69a"/>
  <rect x="51" y="9" width="3" height="1" fill="#ffe69a"/>
  <rect x="52" y="6" width="2" height="3" fill="#0a1030"/>

  <!-- distant waterline -->
  <rect x="5" y="24" width="54" height="1" fill="#1c3770"/>
  <rect x="9" y="25" width="11" height="1" fill="#153064"/>
  <rect x="38" y="25" width="16" height="1" fill="#153064"/>

  <!-- B A S S O; each glyph is deliberately chunky at icon scale -->
  <g fill="#86f0df">
    <!-- B -->
    <rect x="13" y="14" width="2" height="10"/><rect x="15" y="14" width="4" height="2"/><rect x="19" y="16" width="2" height="2"/><rect x="15" y="18" width="4" height="2"/><rect x="19" y="20" width="2" height="2"/><rect x="15" y="22" width="4" height="2"/>
    <!-- A -->
    <rect x="25" y="14" width="2" height="2"/><rect x="23" y="16" width="2" height="8"/><rect x="27" y="16" width="2" height="8"/><rect x="25" y="19" width="2" height="2"/>
    <!-- S -->
    <rect x="33" y="14" width="4" height="2"/><rect x="31" y="16" width="2" height="3"/><rect x="33" y="18" width="4" height="2"/><rect x="37" y="20" width="2" height="2"/><rect x="33" y="22" width="4" height="2"/>
    <!-- S -->
    <rect x="43" y="14" width="4" height="2"/><rect x="41" y="16" width="2" height="3"/><rect x="43" y="18" width="4" height="2"/><rect x="47" y="20" width="2" height="2"/><rect x="43" y="22" width="4" height="2"/>
    <!-- O -->
    <rect x="53" y="14" width="4" height="2"/><rect x="51" y="16" width="2" height="6"/><rect x="57" y="16" width="2" height="6"/><rect x="53" y="22" width="4" height="2"/>
  </g>
  <!-- a restrained one-pixel glow on the word -->
  <rect x="13" y="14" width="6" height="1" fill="#c0fff2"/>
  <rect x="25" y="14" width="2" height="1" fill="#c0fff2"/>
  <rect x="33" y="14" width="4" height="1" fill="#c0fff2"/>
  <rect x="43" y="14" width="4" height="1" fill="#c0fff2"/>
  <rect x="53" y="14" width="4" height="1" fill="#c0fff2"/>
</svg>
