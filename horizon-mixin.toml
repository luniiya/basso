# Basso's native Horizon bundle. Build with:
# horizon-launcher native-build <this folder> --trust-native-code
[mod]
id = "basso"
version = "0.1.0"

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The pathfinder: search, moves, orders and rendering, with no Horizon types.
[[crate]]
id = "engine"
path = "basso-engine"

# All Horizon-facing glue; the hook helpers are one-line wrappers around it.
[[module]]
id = "adapter"
file = "crates/horizon-client/src/game.rs"
name = "basso_adapter"
source = "mixins/basso/adapter.rs"

[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/mods.rs"
bindings = [{ name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" }]

[[injection]]
id = "commands"
hook = "commands"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/commands.rs"
bindings = [{ name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" }]

[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/command.rs"
bindings = [
    { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
    { name = "command", ty = "&str", value = "command" },
    { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "world_primitives"
# In the source but not yet in native-hooks.json, so named by its function.
target = "horizon_client::game::native_hooks::Game<'_>::native_world_primitives"
kind = "HEAD"
helper = "mixins/basso/world_primitives.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
    { name = "primitives", ty = "&mut horizon_client::world_primitives::WorldPrimitives", value = "&mut *primitives" },
]

[[injection]]
id = "movement_input"
hook = "movement_input"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/movement_input.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
    { name = "forward", ty = "&mut f32", value = "&mut *forward" },
    { name = "strafe", ty = "&mut f32", value = "&mut *strafe" },
    { name = "jump", ty = "&mut bool", value = "&mut *jump" },
    { name = "sneak", ty = "&mut bool", value = "&mut *sneak" },
]

[[injection]]
id = "mouse_button"
hook = "mouse_button_pre"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/mouse_button.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
    { name = "button", ty = "i32", value = "button" },
    { name = "pressed", ty = "bool", value = "pressed" },
    { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "mouse_scrolling"
hook = "mouse_scrolling"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/mouse_scrolling.rs"
bindings = [
    { name = "accumulated", ty = "[i32; 2]", value = "accumulated" },
    { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "camera_pose"
hook = "camera_pose"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/camera_pose.rs"
bindings = [
    { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
    { name = "partial", ty = "f32", value = "partial" },
    { name = "position", ty = "&mut [f64; 3]", value = "&mut *position" },
    { name = "yaw", ty = "&mut f32", value = "&mut *yaw" },
    { name = "pitch", ty = "&mut f32", value = "&mut *pitch" },
]

[[injection]]
id = "fov_modifier"
hook = "compute_fov_modifier"
hook_version = 1
kind = "HEAD"
helper = "mixins/basso/fov_modifier.rs"
bindings = [
    { name = "modifier", ty = "&mut f32", value = "&mut *modifier" },
]

# Not a hook point: the mouse's turn of the player (`Entity.turn`). basso
# steers by setting the view itself, so skipping this only stops the mouse.
[[injection]]
id = "turn_player"
target = "horizon_client::game::perspective::Game<'_>::turn_player"
kind = "HEAD"
cancellable = true
helper = "mixins/basso/turn_player.rs"
bindings = [
    { name = "xo", ty = "f64", value = "xo" },
    { name = "yo", ty = "f64", value = "yo" },
]

# Not a hook point: the chat box's command tree, built once per connection.
[[injection]]
id = "chat_tree"
target = "horizon_client::game::chat::Game<'_>::chat_tree_for"
kind = "RETURN"
helper = "mixins/basso/chat_tree.rs"
bindings = [
    { name = "value", ty = "horizon_client::command::Dispatcher", value = "$value" },
]
