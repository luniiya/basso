[workspace]
members = [
    "basso",
    "basso-block",
    "basso-buf",
    "basso-chat",
    "basso-client",
    "basso-core",
    "basso-entity",
    "basso-inventory",
    "basso-language",
    "basso-physics",
    "basso-registry",
    "basso-world",
]
resolver = "3"

# --- Workspace Settings ---

[workspace.package]
version = "0.16.0+mc26.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/luniiya/basso"
# homepage = "https://github.com/azalea-rs/azalea"

[workspace.dependencies]
bevy_app = "0.20.0"
bevy_ecs = { version = "0.20.0", default-features = false, features = [
    "multi_threaded",
] }
bevy_utils = { version = "0.20.0", default-features = false }
bevy_log = "0.20.0"
bevy_tasks = "0.20.0"
bevy_time = "0.20.0"
byteorder = "1.5.0"
compact_str = "0.10.0"
crc32c = "0.6.8"
criterion = "0.8.2"
derive_more = "2.1.1"
enum-as-inner = "0.7.0"
eyre = "0.6.14"
futures = "0.3.34"
futures-lite = "2.6.1"
indexmap = "2.14.2"
nohash-hasher = "0.2.0"
num-format = "0.4.4"
num-traits = "0.2.19"
parking_lot = "0.12.5"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_json = "1.0.154"
simdnbt = "0.10.0"
# simdnbt = { git = "https://github.com/azalea-rs/simdnbt" }
syn = "3.0.9"
thiserror = "2.0.21"
tokio = "1.53.3"
tracing = "0.1.44"
uuid = "1.28.0"
radix-heap = "0.4.2"

basso-block-macros = { path = "basso-block/basso-block-macros", version = "0.16.0", default-features = false }
basso-block = { path = "basso-block", version = "0.16.0", default-features = false }
basso-buf-macros = { path = "basso-buf/basso-buf-macros", version = "0.16.0", default-features = false }
basso-buf = { path = "basso-buf", version = "0.16.0", default-features = false }
basso-chat = { path = "basso-chat", version = "0.16.0", default-features = false }
basso-client = { path = "basso-client", version = "0.16.0", default-features = false }
basso-core = { path = "basso-core", version = "0.16.0", default-features = false }
basso-entity = { path = "basso-entity", version = "0.16.0", default-features = false }
basso-inventory-macros = { path = "basso-inventory/basso-inventory-macros", version = "0.16.0", default-features = false }
basso-inventory = { path = "basso-inventory", version = "0.16.0", default-features = false }
basso-language = { path = "basso-language", version = "0.16.0", default-features = false }
basso-physics = { path = "basso-physics", version = "0.16.0", default-features = false }
basso-registry-macros = { path = "basso-registry/basso-registry-macros", version = "0.16.0", default-features = false }
basso-registry = { path = "basso-registry", version = "0.16.0", default-features = false }
basso-world = { path = "basso-world", version = "0.16.0", default-features = false }

[workspace.lints.clippy]
# https://users.rust-lang.org/t/to-string-vs-to-owned-for-string-literals/1441
str_to_string = "warn"

# --- Profile Settings ---

[profile.release]
debug = "line-tables-only"



# simdnbt needs nightly (portable_simd, allocator_api); the vendored copy is
# patched to build on stable, like Horizon.
[patch.crates-io]
simdnbt = { path = "vendor/simdnbt" }
