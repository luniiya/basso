[workspace]
members = [
    "azalea",
    "azalea-block",
    "azalea-buf",
    "azalea-chat",
    "azalea-client",
    "azalea-core",
    "azalea-entity",
    "azalea-inventory",
    "azalea-language",
    "azalea-physics",
    "azalea-registry",
    "azalea-world",
]
resolver = "3"

# --- Workspace Settings ---

[workspace.package]
version = "0.16.0+mc26.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/luniiya/basso"
# homepage = "https://github.com/azalea-rs/azalea"

[workspace.dependencies]
aes = "0.9.3"
async-compat = "0.2.6"
base64 = "0.23.1"
bevy_app = "0.20.0"
bevy_ecs = { version = "0.20.0", default-features = false, features = [
    "multi_threaded",
] }
bevy_utils = { version = "0.20.0", default-features = false }
bevy_log = "0.20.0"
bevy_tasks = "0.20.0"
bevy_time = "0.20.0"
byteorder = "1.5.0"
cfb8 = "0.9.1"
chrono = { version = "0.4.45", default-features = false }
compact_str = "0.10.0"
crc32c = "0.6.8"
criterion = "0.8.2"
derive_more = "2.1.1"
enum-as-inner = "0.7.0"
env_logger = "0.11.11"
eyre = "0.6.14"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
futures = "0.3.34"
futures-lite = "2.6.1"
hickory-resolver = "0.26.3"
indexmap = "2.14.2"
md-5 = "0.11.0"
minecraft_folder_path = "0.1.2"
nohash-hasher = "0.2.0"
num-bigint = "0.5.1"
num-format = "0.4.4"
num-traits = "0.2.19"
parking_lot = "0.12.5"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
rand_core = "0.10.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rsa = "0.10.0-rc.19"
rsa_public_encrypt_pkcs1 = "0.4.0"
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
simdnbt = "0.10.0"
# simdnbt = { git = "https://github.com/azalea-rs/simdnbt" }
socks5-impl = "0.10.0"
syn = "3.0.9"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.28.0"
radix-heap = "0.4.2"

azalea-block-macros = { path = "azalea-block/azalea-block-macros", version = "0.16.0", default-features = false }
azalea-block = { path = "azalea-block", version = "0.16.0", default-features = false }
azalea-buf-macros = { path = "azalea-buf/azalea-buf-macros", version = "0.16.0", default-features = false }
azalea-buf = { path = "azalea-buf", version = "0.16.0", default-features = false }
azalea-chat = { path = "azalea-chat", version = "0.16.0", default-features = false }
azalea-client = { path = "azalea-client", version = "0.16.0", default-features = false }
azalea-core = { path = "azalea-core", version = "0.16.0", default-features = false }
azalea-entity = { path = "azalea-entity", version = "0.16.0", default-features = false }
azalea-inventory-macros = { path = "azalea-inventory/azalea-inventory-macros", version = "0.16.0", default-features = false }
azalea-inventory = { path = "azalea-inventory", version = "0.16.0", default-features = false }
azalea-language = { path = "azalea-language", version = "0.16.0", default-features = false }
azalea-physics = { path = "azalea-physics", version = "0.16.0", default-features = false }
azalea-registry-macros = { path = "azalea-registry/azalea-registry-macros", version = "0.16.0", default-features = false }
azalea-registry = { path = "azalea-registry", version = "0.16.0", default-features = false }
azalea-world = { path = "azalea-world", version = "0.16.0", default-features = false }

[workspace.lints.clippy]
# https://users.rust-lang.org/t/to-string-vs-to-owned-for-string-literals/1441
str_to_string = "warn"

# --- Profile Settings ---

[profile.release]
debug = "line-tables-only"



# simdnbt needs nightly (portable_simd, allocator_api); the vendored copy is
# patched to build on stable, like Horizon.
[patch.crates-io]
simdnbt = { path = "vendor/simdnbt" }
